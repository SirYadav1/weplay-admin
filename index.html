<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WePlay Admin</title>
<style>
:root{--bg:#0f1420;--sider:#171e2c;--card:#1d2534;--accent:#00ccf9;--ink:#e8ecf4;--muted:#8d98b2;
--red:#e8455f;--green:#3ecf6e;--gold:#ffc53d;--border:#252d40;--hover:#222a3c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#login .box{background:var(--sider);padding:32px;border-radius:14px;width:360px;border:1px solid var(--border)}
#login h1{font-size:22px;color:var(--accent);margin-bottom:4px}
#login .sub{color:var(--muted);font-size:12px;margin-bottom:20px}
#login label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
#login input{width:100%;padding:10px 12px;background:#242b3a;border:1px solid var(--border);border-radius:8px;color:var(--ink);font-size:14px}
#login input:focus{outline:none;border-color:var(--accent)}
#login button{width:100%;padding:11px;background:var(--accent);color:#06202b;border:0;border-radius:8px;font-weight:700;font-size:15px;margin-top:16px}
#login .err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
#login .hint{margin-top:16px;font-size:11px;color:var(--muted)}

/* shell */
.shell{display:none}
.shell.on{display:flex}
aside{width:220px;background:var(--sider);min-height:100vh;padding:16px 0;position:fixed;top:0;bottom:0;left:0;border-right:1px solid var(--border)}
aside .logo{padding:0 20px 16px;font-size:16px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);margin-bottom:12px}
aside nav a,aside nav button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 20px;background:none;border:0;color:var(--muted);font-size:13.5px;text-align:left;transition:.15s}
aside nav a:hover,aside nav button:hover{background:var(--hover);color:var(--ink)}
aside nav button.on{color:var(--accent);border-left:3px solid var(--accent);padding-left:17px}
main{margin-left:220px;padding:24px 32px;flex:1;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.topbar h2{font-size:20px;font-weight:700}
.topbar .who{color:var(--muted);font-size:13px}

/* cards / stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat b{display:block;font-size:26px;color:var(--accent)}
.stat span{color:var(--muted);font-size:12px}

/* tables */
.tblwrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--hover)}

/* controls */
.btn{padding:7px 12px;border-radius:7px;border:1px solid var(--border);background:var(--hover);color:var(--ink);font-size:12.5px}
.btn.primary{background:var(--accent);color:#06202b;border-color:var(--accent);font-weight:700}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:hover{filter:brightness(1.15)}
input,select,textarea{background:#242b3a;border:1px solid var(--border);border-radius:8px;color:var(--ink);padding:9px 12px;font-size:13.5px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.search{display:flex;gap:10px;margin-bottom:14px}
.search input{flex:1;max-width:340px}

/* badges */
.badge{padding:3px 9px;border-radius:11px;font-size:11px;font-weight:700;display:inline-block}
.b-admin{background:#00ccf933;color:var(--accent)}
.b-banned{background:#e8455f33;color:var(--red)}
.b-ok{background:#3ecf6e33;color:var(--green)}
.b-gold{background:#ffc53d33;color:var(--gold)}

/* modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.modal .box{background:var(--sider);border:1px solid var(--border);border-radius:12px;padding:24px;width:400px;max-width:92vw}
.modal h3{margin-bottom:14px;font-size:16px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

#toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--accent);color:var(--ink);padding:12px 18px;border-radius:10px;display:none;z-index:99;font-size:13px}
.audit-act{color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>WePlay Admin</h1>
    <div class="sub">Backend management panel</div>
    <label>Backend URL</label>
    <input id="burl" placeholder="http://107.148.225.79:8080">
    <label>Username</label>
    <input id="lu" autocomplete="username">
    <label>Password</label>
    <input id="lp" type="password" autocomplete="current-password">
    <button onclick="login()">Sign in</button>
    <div class="err" id="lerr"></div>
    <div class="hint">uid 1 is auto-promoted to admin on first signup.</div>
  </div>
</div>

<div class="shell on" id="shell">
  <aside>
    <div class="logo">WePlay Admin</div>
    <nav>
      <button class="on" data-p="stats" onclick="tab('stats')">▦ Dashboard</button>
      <button data-p="users" onclick="tab('users')">👤 Users</button>
      <button data-p="rooms" onclick="tab('rooms')">🏠 Rooms</button>
      <button data-p="reports" onclick="tab('reports')">⚑ Reports</button>
      <button data-p="audit" onclick="tab('audit')">☰ Audit Log</button>
    </nav>
    <div style="position:absolute;bottom:16px;width:100%;padding:0 20px">
      <button class="btn danger" style="width:100%" onclick="logout()">Logout</button>
    </div>
  </aside>
  <main>
    <div class="topbar"><h2 id="ptitle">Dashboard</h2><span class="who" id="who"></span></div>
    <div id="msg"></div>

    <section id="p-stats">
      <div class="stats" id="stats"></div>
      <h3 style="margin:24px 0 10px;font-size:15px">Recent Audit</h3>
      <div class="tblwrap"><table><thead><tr><th>Action</th><th>Target UID</th><th>Detail</th><th>When</th></tr></thead><tbody id="mini-audit"></tbody></table></div>
    </section>

    <section id="p-users" class="hidden">
      <div class="search">
        <input id="q" placeholder="Search nick / email / uid…" onkeydown="if(event.key==='Enter')loadUsers()">
        <button class="btn primary" onclick="loadUsers()">Search</button>
      </div>
      <div class="tblwrap">
        <table><thead><tr><th>UID</th><th>Nick</th><th>Email</th><th>Coins</th><th>VIP</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="urows"></tbody></table>
      </div>
    </section>

    <section id="p-rooms" class="hidden">
      <div class="tblwrap">
        <table><thead><tr><th>RID</th><th>Name</th><th>Owner</th><th>Type</th><th>Created</th><th></th></tr></thead>
        <tbody id="rrows"></tbody></table>
      </div>
    </section>

    <section id="p-reports" class="hidden">
      <div class="tblwrap">
        <table><thead><tr><th>ID</th><th>Kind</th><th>Reporter</th><th>Target</th><th>Reason</th><th>Status</th><th></th></tr></thead>
        <tbody id="reprows"></tbody></table>
      </div>
    </section>

    <section id="p-audit" class="hidden">
      <div class="tblwrap">
        <table><thead><tr><th>#</th><th>Admin UID</th><th>Action</th><th>Target</th><th>Detail</th><th>When</th></tr></thead>
        <tbody id="arows"></tbody></table>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mtitle"></h3>
  <div id="mbody"></div>
  <div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="mok">Confirm</button></div>
</div></div>

<div id="toast"></div>

<script>
let TOKEN='', BASE=localStorage.getItem('wp_base')||'';
const $=id=>document.getElementById(id);
function toast(m,ok=true){const t=$('toast');t.textContent=m;t.style.borderColor=ok?'var(--green)':'var(--red)';t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
async function api(path,opts={}){const r=await fetch(BASE+path,{...opts,headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',...opts.headers}});if(r.status===401){doLogout();throw new Error('auth expired')}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error?.message||('HTTP '+r.status));return d}
function show(m,ok=true){toast(m,ok)}
async function login(){
  BASE=$('burl').value.trim().replace(/\/$/,'');localStorage.setItem('wp_base',BASE);
  const r=await fetch(BASE+'/identity/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});
  const d=await r.json();
  if(!d.accessToken){$('lerr').textContent=d.error?.message||'login failed';return}
  // verify admin
  try{const chk=await fetch(BASE+'/admin/stats',{headers:{Authorization:'Bearer '+d.accessToken}});if(chk.status===403){$('lerr').textContent='this account is not an admin';return}}catch(e){}
  TOKEN=d.accessToken;sessionStorage.setItem('wp_tok',TOKEN);sessionStorage.setItem('wp_who',d.user?.username||'');
  $('lerr').textContent='';openShell();
}
function openShell(){$('login').style.display='none';$('shell').style.display='flex';$('who').textContent='@'+sessionStorage.getItem('wp_who');tab('stats')}
function doLogout(){TOKEN='';sessionStorage.removeItem('wp_tok');$('shell').style.display='none';$('login').style.display='flex'}
function tab(t){
  ['stats','users','rooms','reports','audit'].forEach(x=>{
    $('p-'+x).classList.toggle('hidden',x!==t);
    document.querySelector(`[data-p="${x}"]`).classList.toggle('on',x===t);
  });
  $('ptitle').textContent=t[0].toUpperCase()+t.slice(1);
  ({stats:loadStats,users:loadUsers,rooms:loadRooms,reports:loadReports,audit:loadAudit})[t]();
}
function fmtTime(ts){if(!ts)return'—';const d=new Date(ts*1000);return d.toLocaleString()}
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}

async function loadStats(){
  try{
    const d=await api('/admin/stats');
    $('stats').innerHTML=Object.entries(d).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k.replace(/_/g,' ')}</span></div>`).join('');
    const a=await api('/admin/audit?limit=6');
    $('mini-audit').innerHTML=(a.items||[]).map(x=>`<tr><td><span class="audit-act">${esc(x.action)}</span></td><td>${x.target_uid}</td><td>${esc(x.detail)}</td><td class="muted">${fmtTime(x.created_at)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">no audit entries yet</td></tr>';
  }catch(e){show(e.message,false)}
}
async function loadUsers(){
  try{
    const q=$('q').value.trim();
    const d=await api('/admin/users?q='+encodeURIComponent(q)+'&limit=100');
    $('urows').innerHTML=(d.items||[]).map(u=>`<tr>
      <td>${u.uid}</td><td>${esc(u.nick_name)}</td><td class="muted">${esc(u.email||'—')}</td>
      <td>${u.coin.toLocaleString()}</td><td>${u.vip>0?`<span class="badge b-gold">VIP ${u.vip}</span>`:'—'}</td>
      <td>${u.is_admin?'<span class="badge b-admin">admin</span>':''} ${u.banned?'<span class="badge b-banned">banned</span>':(u.is_admin?'':'<span class="badge b-ok">ok</span>')}</td>
      <td>
        <button class="btn" onclick="coinModal(${u.uid})">Coins</button>
        <button class="btn" onclick="vipModal(${u.uid},${u.vip})">VIP</button>
        <button class="btn" onclick="roleToggle(${u.uid},${u.is_admin})">${u.is_admin?'Demote':'Promote'}</button>
        <button class="btn danger" onclick="banToggle(${u.uid},${u.banned})">${u.banned?'Unban':'Ban'}</button>
      </td></tr>`).join('')||'<tr><td colspan="7" class="muted">no users</td></tr>';
  }catch(e){show(e.message,false)}
}
async function loadRooms(){
  try{
    const d=await api('/admin/rooms?limit=100');
    $('rrows').innerHTML=(d.items||[]).map(r=>`<tr><td>${r.rid}</td><td>${esc(r.name)}</td><td>${r.owner}</td><td>${r.type}</td><td class="muted">${fmtTime(r.created_at)}</td>
      <td><button class="btn danger" onclick="delRoom(${r.rid})">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">no rooms</td></tr>';
  }catch(e){show(e.message,false)}
}
async function loadReports(){
  try{
    const d=await api('/admin/reports?limit=100');
    $('reprows').innerHTML=(d.items||[]).map(r=>`<tr><td>${r.id}</td><td><span class="badge ${r.kind==='bug'?'b-gold':'b-admin'}">${r.kind}</span></td>
      <td>${r.reporter}</td><td>${r.target||'—'}</td><td>${esc(r.reason)}</td><td><span class="badge ${r.status==='resolved'?'b-ok':'b-banned'}">${r.status}</span></td>
      <td>${r.status!=='resolved'?`<button class="btn" onclick="resolve(${r.id})">Resolve</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">no reports</td></tr>';
  }catch(e){show(e.message,false)}
}
async function loadAudit(){
  try{
    const d=await api('/admin/audit?limit=100');
    $('arows').innerHTML=(d.items||[]).map(x=>`<tr><td>${x.id}</td><td>${x.admin_uid}</td><td><span class="audit-act">${esc(x.action)}</span></td><td>${x.target_uid}</td><td>${esc(x.detail)}</td><td class="muted">${fmtTime(x.created_at)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">empty</td></tr>';
  }catch(e){show(e.message,false)}
}
function coinModal(uid){
  $('mtitle').textContent='Adjust coins — uid '+uid;
  $('mbody').innerHTML=`<label>Delta (negative deducts)</label><input id="mdelta" type="number" placeholder="e.g. 500 or -200">
  <label>Reason</label><input id="mreason" placeholder="reason (audited)">`;
  $('mok').onclick=async()=>{const d=parseInt($('mdelta').value);if(!d){show('enter delta',false);return}
    try{await api('/admin/users/'+uid+'/coins',{method:'POST',body:JSON.stringify({delta:d,reason:$('mreason').value||'panel'})});show('coins adjusted');closeModal();loadUsers()}catch(e){show(e.message,false)}};
  $('modal').classList.add('on');
}
function vipModal(uid,cur){
  $('mtitle').textContent='Set VIP tier — uid '+uid;
  $('mbody').innerHTML=`<label>Tier (0 = none)</label><input id="mtier" type="number" min="0" value="${cur||0}">`;
  $('mok').onclick=async()=>{try{await api('/admin/users/'+uid+'/vip',{method:'POST',body:JSON.stringify({tier:parseInt($('mtier').value)||0})});show('VIP set');closeModal();loadUsers()}catch(e){show(e.message,false)}};
  $('modal').classList.add('on');
}
function closeModal(){$('modal').classList.remove('on')}
async function roleToggle(uid,isAdmin){try{await api('/admin/users/'+uid+'/role',{method:'POST',body:JSON.stringify({is_admin:!isAdmin})});show(isAdmin?'demoted':'promoted');loadUsers()}catch(e){show(e.message,false)}}
async function banToggle(uid,banned){try{await api('/admin/users/'+uid+'/ban',{method:'POST',body:JSON.stringify({banned:!banned,reason:'panel'})});show(banned?'unbanned':'banned');loadUsers()}catch(e){show(e.message,false)}}
async function delRoom(rid){if(!confirm('Delete room '+rid+'?'))return;try{await api('/admin/rooms/'+rid,{method:'DELETE'});show('room deleted');loadRooms()}catch(e){show(e.message,false)}}
async function resolve(id){try{await api('/admin/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({})});show('resolved');loadReports()}catch(e){show(e.message,false)}}
function logout(){doLogout()}

if(sessionStorage.getItem('wp_tok')){
  TOKEN=sessionStorage.getItem('wp_tok');
  BASE=localStorage.getItem('wp_base')||'';
  $('burl').value=BASE;
  $('login').style.display='none';$('shell').style.display='flex';
  $('who').textContent='@'+(sessionStorage.getItem('wp_who')||'');
  tab('stats');
}
</script>
</body>
</html>
