<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WePlay Admin</title>
<style>
:root{--bg:#141821;--card:#1d2330;--accent:#00ccf9;--ink:#eee;--muted:#9aa3b7;--red:#e8455f;--green:#3ecf6e;--gold:#ffc53d}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif;margin:0}
header{background:var(--card);padding:14px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;color:var(--accent)}
#login-box{max-width:360px;margin:80px auto;background:var(--card);padding:24px;border-radius:12px}
#login-box input{width:100%;padding:10px;margin:8px 0;border:1px solid #333;border-radius:8px;background:#242b3a;color:var(--ink)}
#login-box button{width:100%;padding:10px;background:var(--accent);border:0;border-radius:8px;font-weight:bold;cursor:pointer}
main{padding:20px;max-width:1000px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;background:var(--card);border:1px solid #333;color:var(--muted);border-radius:8px;cursor:pointer}
.tabs button.active{color:var(--accent);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid #2a3140}
th{color:var(--muted);font-weight:600}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.badge.admin{background:#00ccf933;color:var(--accent)}
.badge.banned{background:#e8455f33;color:var(--red)}
.badge.ok{background:#3ecf6e33;color:var(--green)}
button.act{padding:4px 10px;font-size:12px;border-radius:6px;border:1px solid #444;background:#242b3a;color:var(--ink);cursor:pointer;margin-right:4px}
button.act.danger{border-color:var(--red);color:var(--red)}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
#stats div{background:var(--card);padding:14px;border-radius:10px;text-align:center}
#stats b{display:block;font-size:24px;color:var(--accent)}
.hidden{display:none}
#msg{padding:8px;margin-bottom:10px;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<header><h1>WePlay Admin</h1><span id="who" style="color:var(--muted)"></span><span style="flex:1"></span><button class="act" onclick="logout()">Logout</button></header>

<div id="login-box">
  <h2 style="margin-top:0">Sign in</h2>
  <p style="color:var(--muted);font-size:13px">Use an admin account (uid 1 is auto-promoted).</p>
  <input id="u" placeholder="username">
  <input id="p" type="password" placeholder="password">
  <button onclick="login()">Login</button>
  <div id="lmsg" style="color:var(--red);font-size:13px"></div>
  <label style="font-size:12px;color:var(--muted)">Backend URL:<input id="burl" style="width:100%;margin-top:4px;background:#242b3a;border:1px solid #333;color:var(--ink);padding:6px;border-radius:6px" placeholder="http://107.148.225.79:8080"></label>
</div>

<main id="app" class="hidden">
  <div id="msg"></div>
  <div class="tabs">
    <button id="t-stats" class="active" onclick="tab('stats')">Dashboard</button>
    <button id="t-users" onclick="tab('users')">Users</button>
    <button id="t-rooms" onclick="tab('rooms')">Rooms</button>
    <button id="t-reports" onclick="tab('reports')">Reports</button>
  </div>

  <section id="p-stats"><div id="stats"></div></section>

  <section id="p-users" class="hidden">
    <input id="q" placeholder="search nick / email / uid" style="width:300px;padding:8px;background:#242b3a;border:1px solid #333;color:var(--ink);border-radius:8px" onkeydown="if(event.key==='Enter')loadUsers()">
    <button class="act" onclick="loadUsers()">Search</button>
    <div style="height:12px"></div>
    <table id="users-table"><thead><tr><th>UID</th><th>Nick</th><th>Email</th><th>Coins</th><th>Roles</th><th>Actions</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="p-rooms" class="hidden">
    <table id="rooms-table"><thead><tr><th>RID</th><th>Name</th><th>Owner</th><th>Type</th><th></th></tr></thead><tbody></tbody></table>
  </section>

  <section id="p-reports" class="hidden">
    <table id="reports-table"><thead><tr><th>ID</th><th>Reporter</th><th>Category</th><th>Message</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
  </section>
</main>

<script>
let TOKEN='', BASE=localStorage.getItem('wp_admin_base')||'';
const $=id=>document.getElementById(id);
function show(m,color){const e=$('msg');e.textContent=m;e.style.background=color==='ok'?'#3ecf6e33':'#e8455f33';setTimeout(()=>e.textContent='',4000)}
async function api(path,opts={}){
  const r=await fetch(BASE+path,{...opts,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){logout();throw new Error('auth')}
  return r.json();
}
async function login(){
  BASE=$('burl').value.trim().replace(/\/$/,'');localStorage.setItem('wp_admin_base',BASE);
  const r=await fetch(BASE+'/identity/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});
  const d=await r.json();
  if(!d.accessToken){$('lmsg').textContent=d.error?.message||'login failed';return}
  TOKEN=d.accessToken;sessionStorage.setItem('wp_tok',TOKEN);
  $('login-box').classList.add('hidden');$('app').classList.remove('hidden');
  $('who').textContent='@'+d.user?.username||'';
  loadStats();loadUsers();
}
function logout(){TOKEN='';sessionStorage.removeItem('wp_tok');$('app').classList.add('hidden');$('login-box').classList.remove('hidden')}
function tab(t){['stats','users','rooms','reports'].forEach(x=>{$('p-'+x).classList.toggle('hidden',x!==t);$('t-'+x).classList.toggle('active',x===t)});if(t==='stats')loadStats();if(t==='users')loadUsers();if(t==='rooms')loadRooms();if(t==='reports')loadReports()}
async function loadStats(){const d=await api('/admin/stats');$('stats').innerHTML=Object.entries(d).map(([k,v])=>`<div><b>${v}</b>${k.replace('_',' ')}</div>`).join('')}
async function loadUsers(){const q=$('q')?.value||'';const d=await api('/admin/users?q='+encodeURIComponent(q));
  $('users-table').querySelector('tbody').innerHTML=(d.items||[]).map(u=>`<tr>
    <td>${u.uid}</td><td>${u.nick_name}</td><td>${u.email||'—'}</td><td>${u.coin}</td>
    <td>${u.is_admin?'<span class="badge admin">admin</span>':''} ${u.banned?'<span class="badge banned">banned</span>':'<span class="badge ok">ok</span>'}</td>
    <td>
      <button class="act" onclick="coins(${u.uid})">+coins</button>
      <button class="act" onclick="role(${u.uid},${u.is_admin})">${u.is_admin?'demote':'promote'}</button>
      <button class="act danger" onclick="ban(${u.uid},${u.banned})">${u.banned?'unban':'ban'}</button>
    </td></tr>`).join('')}
async function coins(uid){const d=prompt('coin delta (use - to deduct)');if(!d)return;await api('/admin/users/'+uid+'/coins',{method:'POST',body:JSON.stringify({delta:parseInt(d),reason:'panel'})});show('coins adjusted','ok');loadUsers()}
async function role(uid,cur){await api('/admin/users/'+uid+'/role',{method:'POST',body:JSON.stringify({is_admin:!cur})});show('role updated','ok');loadUsers()}
async function ban(uid,cur){await api('/admin/users/'+uid+'/ban',{method:'POST',body:JSON.stringify({banned:!cur,reason:'panel'})});show(cur?'unbanned':'banned','ok');loadUsers()}
async function loadRooms(){const d=await api('/admin/rooms');$('rooms-table').querySelector('tbody').innerHTML=(d.items||[]).map(r=>`<tr><td>${r.rid}</td><td>${r.name}</td><td>${r.owner}</td><td>${r.type}</td><td><button class="act danger" onclick="delRoom(${r.rid})">delete</button></td></tr>`).join('')}
async function delRoom(rid){if(!confirm('Delete room '+rid+'?'))return;await api('/admin/rooms/'+rid,{method:'DELETE'});show('room deleted','ok');loadRooms()}
async function loadReports(){const d=await api('/admin/reports');$('reports-table').querySelector('tbody').innerHTML=(d.items||[]).map(r=>`<tr><td>${r.id}</td><td>${r.reporter}</td><td>${r.category}</td><td>${r.message}</td><td>${r.status}</td><td><button class="act" onclick="resolve(${r.id})">resolve</button></td></tr>`).join('')}
async function resolve(id){await api('/admin/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({note:'resolved via panel'})});show('resolved','ok');loadReports()}
if(sessionStorage.getItem('wp_tok')){TOKEN=sessionStorage.getItem('wp_tok');$('login-box').classList.add('hidden');$('app').classList.remove('hidden');loadStats();loadUsers()}
</script>
</body>
</html>
